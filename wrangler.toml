# Cloudflare Worker (Static Assets) für dvgp.info
#
# Deployment: automatisch bei jedem Git-Push auf main via Cloudflare Workers Builds.
# Manuell:    npx wrangler deploy
#
# WICHTIG: Diese Datei liegt NEBEN site/, nicht darin. "./site" ist deshalb Pflicht --
# mit "./" würde Cloudflare das Projektwurzelverzeichnis ausliefern und damit auch
# .git/ und interne Dateien öffentlich abrufbar machen.

name = "dvgp-website"
compatibility_date = "2026-08-10"

# Solange die Zone dvgp.info noch nicht im Cloudflare-Konto liegt, läuft die Seite
# unter der workers.dev-Adresse. Muss VOR [assets] stehen -- in TOML gehört alles
# unterhalb einer Tabellenüberschrift zu dieser Tabelle.
workers_dev = true

[assets]
directory = "./site"
not_found_handling = "404-page"
# html_handling bleibt auf dem Standard "auto-trailing-slash": Cloudflare liefert
# /impressum aus site/impressum.html. Deshalb verlinkt die Seite intern ohne .html.
# "none" wäre falsch -- dann liefert / keine Startseite mehr, sondern 404.

# Eigene Domain -- AKTIVIEREN, SOBALD DIE ZONE STEHT.
# Cloudflare legt die DNS-Einträge dann beim Deploy selbst an; von Hand ist nichts
# einzutragen. Vorher schlägt der Deploy mit einer Zone-Fehlermeldung fehl, deshalb
# ist der Block auskommentiert. Ablauf: DEPLOYMENT.md.
#
# [[routes]]
# pattern = "dvgp.info"
# custom_domain = true
#
# [[routes]]
# pattern = "www.dvgp.info"
# custom_domain = true
